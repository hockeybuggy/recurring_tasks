[package]
name = "recurring-tasks"
version = "0.1.0"
authors = ["Douglas Anderson <hockeybuggy@gmail.com>"]
edition = "2024"
license = "MIT"

[lib]
name = "recurring_tasks"
path = "src/lib.rs"

[[bin]]
name = "recurring_tasks_bin"
path = "src/bin.rs"

[dependencies]
chrono = "0.4"
chrono-tz = "0.10"
clap = "4.6"
cron = "0.17"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
toml = "1.1"
